name: Release

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  # Run tests first before releasing
  # PHP version fixed at 8.4 here; see ci.yml for the full 8.2/8.4 matrix.
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2.37.0
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, json
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress --no-scripts

      - name: Install Node dependencies
        run: npm ci

      - name: Run PHP linting
        run: composer lint

      - name: Run JS linting
        run: npm run lint

      - name: Run PHP tests
        run: composer test

      - name: Run JS tests
        run: npm test

      - name: Build assets
        run: npm run build

  release:
    name: Release
    needs: test
    runs-on: ubuntu-latest
    # Required reviewer: the job waits until a reviewer of the "release"
    # environment approves it (Settings > Environments > release > Required
    # reviewers). Without that setting the environment adds no gate.
    environment: release
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build

      - name: Sync version to style.css
        run: |
          VERSION=$(node -p "require('./package.json').version")
          sed -i "s/^Version: .*/Version: $VERSION/" style.css

      - name: Release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OUTPUT=$(npx semantic-release 2>&1)
          echo "$OUTPUT"
          # Fragile: matches semantic-release's log wording, not a stable exit signal.
          # A wording change in a future semantic-release version can silently
          # break release detection here without failing the job.
          if echo "$OUTPUT" | grep -Eiq "published release|published .* release"; then
            echo "released=true" >> $GITHUB_OUTPUT
          else
            echo "released=false" >> $GITHUB_OUTPUT
          fi

      - name: Sync style.css version after release
        if: steps.semantic.outputs.released == 'true'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          sed -i "s/^Version: .*/Version: $VERSION/" style.css

      - name: Setup PHP for packaging
        if: steps.semantic.outputs.released == 'true'
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2.37.0
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Install PHP dependencies for packaging
        if: steps.semantic.outputs.released == 'true'
        run: composer install --prefer-dist --no-progress --no-dev --no-scripts

      - name: Package theme
        if: steps.semantic.outputs.released == 'true'
        run: npm run package

      - name: Checksum release zip
        if: steps.semantic.outputs.released == 'true'
        run: |
          ZIP=$(ls wp-theme/*.zip | head -1)
          # Bare filename in the checksum line, so `shasum -c` works from the download folder.
          (cd "$(dirname "${ZIP}")" && shasum -a 256 "$(basename "${ZIP}")" > "$(basename "${ZIP}").sha256")

      - name: Upload release asset
        if: steps.semantic.outputs.released == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ZIP=$(ls wp-theme/*.zip | head -1)
          gh release upload "v${VERSION}" "${ZIP}" "${ZIP}.sha256" --clobber

      - name: Signing reminder
        if: steps.semantic.outputs.released == 'true'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ZIP=$(basename "$(ls wp-theme/*.zip | head -1)")
          {
            echo "## v${VERSION} still needs its signature"
            echo
            echo "Sites refuse this update until \`${ZIP}.sig\` is attached. The key stays offline, so sign locally:"
            echo
            echo '```sh'
            echo "gh release download v${VERSION} -p '${ZIP}' -p '${ZIP}.sha256'"
            echo "shasum -a 256 -c ${ZIP}.sha256"
            echo "php scripts/release-signing.php sign ${ZIP} ~/.config/wp-starter/release.key"
            echo "gh release upload v${VERSION} ${ZIP}.sig"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
